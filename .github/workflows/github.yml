name: Node.js CI/CD

on:
  push:
    tags:
      - 'v*'

# Needed so pnpm install can read @sythir/config-merger from GitHub Packages,
# and so the release job can publish GitHub releases.
permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: linux-x64
            output: agent-linux
          - target: win-x64
            output: agent-win.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.3.0

      - name: Install dependencies
        run: pnpm install
        env:
          # config-merger is linked to this repo in GitHub Packages, so the
          # default GITHUB_TOKEN can read it (see agent/.npmrc).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject version
        run: |
          sed -i "s/__BUILD_VERSION__/${{ github.ref_name }}/g" src/version.ts
          cat src/version.ts

      - name: Build application
        run: pnpm build

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pkg-cache-${{ matrix.target }}-

      - name: Build package for ${{ matrix.target }}
        # pkg-fetch downloads the base Node binary from a GitHub release asset with no
        # built-in retry - a transient 429 there makes it silently fall back to building
        # from source, which only works for the runner's own platform (Linux), so a Windows
        # build fails outright instead of just being slow. Retry a few times with backoff.
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            pnpm exec pkg . --target node18-${{ matrix.target }} --output ./bin/${{ matrix.output }}
            status=$?
            [ $status -eq 0 ] && exit 0
            echo "pkg build failed (attempt $attempt/5), likely a transient rate limit fetching the base Node.js binary - retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Generate checksum
        run: |
          cd bin
          sha256sum ${{ matrix.output }} > ${{ matrix.output }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            ./bin/${{ matrix.output }}
            ./bin/${{ matrix.output }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/**/* release/ || true
          cp scripts/launcher.sh release/
          cp scripts/launcher.ps1 release/
          cp scripts/install-windows-service.ps1 release/
          cp scripts/uninstall-windows-service.ps1 release/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }} of Sythir's Hydra Deploy Agent.

            ## Downloads
            - `agent-linux` - Linux x64 binary
            - `agent-win.exe` - Windows x64 binary
            - `launcher.sh` - Linux launcher script
            - `launcher.ps1` - Windows PowerShell launcher script
            - `install-windows-service.ps1` - Installs the agent as a Windows Scheduled Task (survives RDP logoff)
            - `uninstall-windows-service.ps1` - Removes that Scheduled Task

            ## Checksums
            See `.sha256` files for verification.

            ## Installation
            1. Download the appropriate binary and launcher script for your platform
            2. Place both files in `~/HydraAgent/current/` (Linux) or `%USERPROFILE%\HydraAgent\current\` (Windows)
            3. Run the launcher script to start the agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
